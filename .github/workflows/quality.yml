name: Quality checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Verify generated game protocol
        run: node ../../scripts/sync-contracts.mjs --check
      - name: Runtime dependency security check
        run: npm audit --omit=dev --audit-level=high
      - name: Lint frontend
        if: matrix.app == 'frontend'
        run: npm run lint
      - name: Backend regression and socket tests
        if: matrix.app == 'backend'
        run: npm test
      - name: Deployment settings and rollback regression
        if: matrix.app == 'backend'
        run: bash ../../deploy/test-deploy.sh
      - name: Build
        run: npm run build
